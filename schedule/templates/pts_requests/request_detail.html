{% extends 'base.html' %}
{% block title %}<title>Пост {{ title }}</title>{% endblock %}
{% block content %}

    <div class="row">
      <aside class="col-12 col-md-3">
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            Broadcast date: {{ ptsrequest.broadcast_date|date:'d E Y' }}

      </article>  
    </div>
  </div>
{% endblock %}
