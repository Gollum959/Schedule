{% load static %}
<nav class="navbar navbar-light" style="background-color: lightskyblue">
  <div class="container">
    <a class="navbar-brand" href="{% url 'pts_requests:index' %}">
      <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
      <span style="color:red">BT</span>schedule</a>
    </a>
    {% with request.resolver_match.view_name as view_name %} 
    <ul class="nav nav-pills">
      {% if user.is_authenticated %}
        <li class="nav-item"> 
          <a class="nav-link {% if view_name  == 'place:places' %}active{% endif %}" href="{% url 'place:places' %}">
            Places
          </a>
        </li>
        <li class="nav-item"> 
          <a class="nav-link {% if view_name  == 'config:pts_configs' %}active{% endif %}" href="{% url 'config:pts_configs' %}">
            Configurations
          </a>
        </li>
        <li class="nav-item"> 
          <a class="nav-link link-light" href="{% url 'users:logout' %}">
            Выйти
          </a>
        </li>
        <li class="navbar-brand">
          Пользователь: {{ user.username }}
        </li>
      {% else %}
        <li class="nav-item"> 
          <a class="nav-link link-light {% if view_name  == 'users:login' %}active{% endif %}" href="{% url 'users:login' %}">
            Войти
          </a>
        </li>
      {% endif %}
    </ul>
    {% endwith %} 
  </div>
</nav>
