  {% load crispy_forms_tags %}
  <div class="row ms-3 pb-3 align-items-center">
    <div class="col-3 justify-content-start">
      <form hx-put="{% url 'pts_requests:config_choice_pts' ptsrequest.pk %}" hx-target="#config-choice-pts">
        {% csrf_token %}
    
        {{ form|crispy }}
      
        <button class="btn btn-secondary btn-sm" type="submit">
          Сохранить
        </button>
        <button class="btn btn-secondary btn-sm"
          hx-get="{% url 'pts_requests:config_choice_pts' ptsrequest.pk %}?step=back"
          hx-target="#config-choice-pts"
        >
          Назад
        </button>
    </div>
  </div>
